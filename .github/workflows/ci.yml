name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Test
        run: pytest -q --cov=aibtc_nexus --cov-report=term-missing --cov-fail-under=90
      - name: Demo
        run: aibtc-nexus demo

  regtest:
    # Real Lightning payments between two LND nodes on a throwaway regtest network.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Start regtest network
        run: scripts/regtest.sh up
        env:
          REGTEST_DIR: ${{ runner.temp }}/regtest
      - name: Test against real LND
        env:
          REGTEST_DIR: ${{ runner.temp }}/regtest
        run: |
          source "$REGTEST_DIR/env.sh"
          pytest tests/test_regtest_lnd.py -v --no-cov
      - name: Node logs on failure
        if: failure()
        run: tail -n 50 "${{ runner.temp }}"/regtest/*.log || true
